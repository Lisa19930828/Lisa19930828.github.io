    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

            min-height:100vh;
            display:flex;

        }

        p{color:#ffffff;font-size:16px;line-height:1.7;margin-bottom:30px;text-shadow:0 1px 1px rgba(0,0,0,0.5);}
        .back-btn{
            display:inline-block;
            padding:12px 30px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:6px;
            transition:0.3s;
        }
        .back-btn:hover{background:#1d4ed8;}
