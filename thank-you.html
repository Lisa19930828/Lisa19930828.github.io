<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | Joy Decoration</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8f9fa;padding:20px;text-align:center;}
.box{max-width:600px;background:#fff;padding:50px 30px;border-radius:12px;box-shadow:0 3px 15px #eee;}
h1{color:#222;margin-bottom:20px;font-size:32px;}
p{color:#555;font-size:17px;line-height:1.7;margin-bottom:35px;}
.back-home{display:inline-block;padding:14px 32px;background:#2563eb;color:#fff;text-decoration:none;border-radius:6px;font-weight:500;}
.back-home:hover{background:#1d4ed8;}
</style>
<!-- 你的原有GA4全局代码保留不动，下方单独埋generate_lead转化 -->
<script>
// 页面加载自动上报询盘转化generate_lead
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('event','generate_lead',{value:0,currency:"USD"});
</script>
</head>
<body>
<div class="box">
<h1>Thank You for Your Inquiry!</h1>
<p>Your message has been received successfully.<br>We will review your requirement and reply you within 24 hours.</p>
<a href="/" class="back-home">Back to Homepage</a>
</div>
</body>
</html>
